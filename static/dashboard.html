<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor-AutoUpdater</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0f1114; --surface: #1a1d23; --surface2: #22262e; --border: #2a2e37;
  --text: #e4e6eb; --dim: #8b8f98; --label: #6b7080;
  --green: #22c55e; --green-bg: rgba(34,197,94,.08); --green-b: rgba(34,197,94,.25);
  --amber: #f59e0b; --amber-bg: rgba(245,158,11,.08); --amber-b: rgba(245,158,11,.25);
  --red: #ef4444; --red-bg: rgba(239,68,68,.08); --red-b: rgba(239,68,68,.25);
  --blue: #3b82f6; --blue-bg: rgba(59,130,246,.10); --blue-b: rgba(59,130,246,.3);
  --grey: #6b7280; --grey-bg: rgba(107,114,128,.08); --grey-b: rgba(107,114,128,.25);
}
body { font-family: 'Cascadia Code','SF Mono','Fira Code',Consolas,monospace; background: var(--bg);
       color: var(--text); min-height: 100vh; padding: 24px; font-size: 13px; }
.header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
          margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.header h1 { font-size: 18px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }
.header h1 span { color: var(--blue); }
.lab-name { font-size: 11px; font-weight: 600; letter-spacing: 1px; color: #93c5fd; background: var(--blue-bg);
            border: 1px solid var(--blue-b); border-radius: 4px; padding: 3px 8px; margin-left: 10px; vertical-align: middle; }
.lab-name:empty { display: none; }
.meta { display: flex; gap: 18px; align-items: center; font-size: 11px; color: var(--dim); flex-wrap: wrap; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--green); }
.dot.busy { background: var(--amber); animation: pulse 1s ease-in-out infinite; }
.dot.down { background: var(--red); }
@keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .3 } }
button, .btn { font-family: inherit; font-size: 11px; background: var(--surface2); color: var(--text);
  border: 1px solid var(--border); border-radius: 4px; padding: 6px 12px; cursor: pointer; text-decoration: none;
  letter-spacing: .5px; }
button:hover, .btn:hover { border-color: var(--dim); }
button.primary { background: var(--blue-bg); border-color: var(--blue-b); color: #93c5fd; }
button:disabled { opacity: .5; cursor: default; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; margin-bottom: 28px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 18px; }
.card.changed { border-color: var(--amber-b); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
.card-title { font-size: 14px; font-weight: 600; }
.card-sub { font-size: 11px; color: var(--dim); margin-top: 3px; }
.badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 600;
         text-transform: uppercase; letter-spacing: 1px; border: 1px solid; white-space: nowrap; }
.b-ok, .b-added { background: var(--green-bg); color: var(--green); border-color: var(--green-b); }
.b-error, .b-removed { background: var(--red-bg); color: var(--red); border-color: var(--red-b); }
.b-changed, .b-collecting { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-b); }
.b-pending, .b-baseline { background: var(--grey-bg); color: var(--grey); border-color: var(--grey-b); }
.b-info { background: var(--blue-bg); color: #93c5fd; border-color: var(--blue-b); }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 10px; font-size: 12px; }
.kv .k { color: var(--label); }
.kv .v { word-break: break-word; }
.err { margin-top: 12px; padding: 8px 10px; border-radius: 4px; background: var(--red-bg); color: #fca5a5;
       border: 1px solid var(--red-b); font-size: 11px; word-break: break-word; }
.warn { color: var(--amber); font-size: 11px; margin-top: 8px; }
.card-foot { margin-top: 14px; display: flex; justify-content: space-between; align-items: center; }
.section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
.section-head h2 { font-size: 13px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--dim); }
.filters { display: flex; gap: 10px; align-items: center; font-size: 11px; color: var(--dim); flex-wrap: wrap; }
select { font-family: inherit; font-size: 11px; background: var(--surface2); color: var(--text);
         border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; }
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
th { text-align: left; font-weight: 500; color: var(--label); font-size: 10px; text-transform: uppercase;
     letter-spacing: 1px; padding: 10px 12px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--surface); }
td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: none; }
td.item { word-break: break-word; }
td.old { color: #fca5a5; word-break: break-word; }
td.new { color: #86efac; word-break: break-word; }
td.nowrap { white-space: nowrap; color: var(--dim); }
tr.fresh { animation: flash 3s ease-out; }
@keyframes flash { from { background: rgba(245,158,11,.25) } to { background: transparent } }
.empty { padding: 24px; text-align: center; color: var(--dim); }
/* detail drawer */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; z-index: 10; }
.overlay.open { display: block; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(1100px, 96vw); background: var(--bg);
          border-left: 1px solid var(--border); z-index: 11; transform: translateX(100%); transition: transform .2s;
          display: flex; flex-direction: column; }
.drawer.open { transform: none; }
.drawer-head { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.tabs { display: flex; gap: 4px; padding: 10px 22px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tab { padding: 8px 12px; font-size: 11px; color: var(--dim); cursor: pointer; border: 1px solid transparent;
       border-bottom: none; border-radius: 4px 4px 0 0; }
.tab.active { color: var(--text); background: var(--surface); border-color: var(--border); }
.drawer-body { padding: 18px 22px; overflow: auto; flex: 1; }
pre { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px;
      font-size: 11px; white-space: pre-wrap; word-break: break-word; color: #cbd5e1; margin-bottom: 16px; }
h3 { font-size: 11px; color: var(--label); text-transform: uppercase; letter-spacing: 1px; margin: 4px 0 8px; }
.note { color: var(--dim); font-size: 11px; margin-bottom: 12px; }
@media (max-width: 640px) { body { padding: 14px; } .kv { grid-template-columns: 120px 1fr; } }
</style>
</head>
<body>

<div class="header">
  <h1>Monitor-<span>AutoUpdater</span> <small id="lab-name" class="lab-name"></small></h1>
  <div class="meta">
    <span id="poll-state"><span class="dot"></span>idle</span>
    <span id="last-cycle">Last cycle: —</span>
    <span id="next-run">Next: —</span>
    <button class="primary" id="btn-collect" onclick="collectNow()">Collect now</button>
    <a class="btn" href="/api/changes.csv">Export CSV</a>
  </div>
</div>

<div class="grid" id="hosts"></div>

<div class="section-head">
  <h2>Change log</h2>
  <div class="filters">
    <label>Host <select id="f-host" onchange="renderChanges()"><option value="">All</option></select></label>
    <label>Category <select id="f-cat" onchange="renderChanges()"><option value="">All</option></select></label>
    <label><input type="checkbox" id="f-catalogue" onchange="renderChanges()" checked> include CPUSE catalogue</label>
    <label><input type="checkbox" id="f-base" onchange="renderChanges()"> show baseline events</label>
  </div>
</div>
<div class="table-wrap" style="max-height: 60vh;">
  <table>
    <thead><tr><th>Time</th><th>Host</th><th>Category</th><th>Change</th><th>Item</th><th>Old</th><th>New</th></tr></thead>
    <tbody id="changes"></tbody>
  </table>
</div>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head">
    <div><div class="card-title" id="d-title"></div><div class="card-sub" id="d-sub"></div></div>
    <div style="display:flex; gap:8px;">
      <button onclick="rebaseline()" title="Make the latest good snapshot the new baseline">Re-baseline</button>
      <button onclick="closeDrawer()">Close</button>
    </div>
  </div>
  <div class="tabs" id="d-tabs"></div>
  <div class="drawer-body" id="d-body"></div>
</div>

<script>
let STATE = null, lastGen = -1, knownKeys = null, openHost = null, hostData = null, activeTab = 'drift';
let refreshMs = 5000, timer = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge = (cls, text) => `<span class="badge b-${esc(cls)}">${esc(text ?? cls)}</span>`;
const evKey = e => [e.ts, e.host, e.section, e.item, e.change].join('|');

function ago(iso) {
  if (!iso) return '—';
  const t = new Date(iso.endsWith('Z') ? iso : iso.replace(' ', 'T'));
  const s = Math.round((Date.now() - t.getTime()) / 1000);
  if (isNaN(s)) return iso;
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m ago`;
  return t.toLocaleString();
}
const localTime = iso => iso ? new Date(iso).toLocaleString() : '—';

async function refresh() {
  try {
    const r = await fetch('/api/state', {cache: 'no-store'});
    STATE = await r.json();
    STATE.offset = STATE.server_time - Date.now() / 1000;
    if (STATE.lab) { document.querySelector('#lab-name').textContent = STATE.lab.name;
                     document.title = document.title.replace(/Monitor-AutoUpdater.*/, 'Monitor-AutoUpdater - ' + STATE.lab.name); }
    document.querySelector('#poll-state').innerHTML = STATE.collecting
      ? '<span class="dot busy"></span>collecting…' : '<span class="dot"></span>idle';
    document.querySelector('#btn-collect').disabled = STATE.collecting;
    document.querySelector('#last-cycle').textContent = 'Last cycle: ' + (STATE.last_cycle || '—');
    updateNext();
    const newRefresh = (STATE.ui_refresh_seconds || 5) * 1000;
    if (newRefresh !== refreshMs) { refreshMs = newRefresh; clearInterval(timer); timer = setInterval(refresh, refreshMs); }
    if (STATE.generation !== lastGen) {
      lastGen = STATE.generation;
      renderHosts();
      renderFilters();
      renderChanges();
      if (openHost) loadHost(openHost, false);
    } else {
      renderHosts(); // keep relative times fresh
    }
  } catch (e) {
    document.querySelector('#poll-state').innerHTML = '<span class="dot down"></span>dashboard offline';
  }
}

function updateNext() {
  if (!STATE || !STATE.next_run || STATE.collecting) { document.querySelector('#next-run').textContent = 'Next: —'; return; }
  const s = Math.max(0, Math.round(STATE.next_run - (Date.now() / 1000 + STATE.offset)));
  document.querySelector('#next-run').textContent = `Next: ${Math.floor(s / 60)}m ${s % 60}s (every ${STATE.interval_minutes}m)`;
}

function renderHosts() {
  const el = document.querySelector('#hosts');
  el.innerHTML = STATE.hosts.map(h => {
    const st = h.state || 'pending';
    const drift = h.drift > 0 ? badge('changed', `${h.drift} since baseline`) : (h.baseline ? badge('ok', 'no drift') : '—');
    const failed = (h.failed_sections || []).length
      ? `<div class="warn">Sections not collected: ${esc(h.failed_sections.join(', '))}</div>` : '';
    return `<div class="card ${h.drift > 0 ? 'changed' : ''}">
      <div class="card-head">
        <div><div class="card-title">${esc(h.name)}</div>
             <div class="card-sub">${esc(h.ip)} · ${esc(h.role)}${h.hostname && h.hostname !== h.name ? ' · ' + esc(h.hostname) : ''}</div></div>
        ${badge(st, st)}
      </div>
      <div class="kv">
        <div class="k">Release</div><div class="v">${esc(h.release || '—')}</div>
        <div class="k">AutoUpdater take</div><div class="v">${esc(h.au_take || '—')}</div>
        <div class="k">DA (CPUSE) build</div><div class="v">${esc(h.da_build || '—')}</div>
        <div class="k">AU components</div><div class="v">${h.components}</div>
        <div class="k">Bundles (cpinfo)</div><div class="v">${h.bundles}</div>
        <div class="k">CPUSE installed</div><div class="v">${h.cpuse_installed} lines</div>
        <div class="k">Consent flags</div><div class="v">${consentBadges(h.consent)}</div>
        <div class="k">Drift</div><div class="v">${drift}</div>
        <div class="k">Baseline</div><div class="v">${h.baseline ? localTime(h.baseline) : '—'}</div>
        <div class="k">Last good poll</div><div class="v">${ago(h.last_good)}</div>
      </div>
      ${failed}
      ${h.state === 'error' && h.error ? `<div class="err">${esc(h.error)}</div>` : ''}
      <div class="card-foot">
        <span class="card-sub">${h.last_events ? badge('changed', h.last_events + ' new last poll') : ''}</span>
        <button onclick="openDrawer('${esc(h.name)}')">Details</button>
      </div>
    </div>`;
  }).join('');
}

function consentBadges(c) {
  const short = {'Download Security': 'DL-Sec', 'Download Non-Security': 'DL-NonSec', 'Upload Information': 'UL-Info', 'Upload Crash Data': 'UL-Crash'};
  const keys = Object.keys(short).filter(k => k in (c || {}));
  if (!keys.length) return '—';
  return keys.map(k => badge(c[k] === 'true' ? 'ok' : (c[k] === 'false' ? 'pending' : 'changed'), short[k])).join(' ');
}

function renderFilters() {
  const hs = document.querySelector('#f-host'), cs = document.querySelector('#f-cat');
  const hv = hs.value, cv = cs.value;
  const cats = [...new Set(STATE.changes.map(e => e.category))].sort();
  hs.innerHTML = '<option value="">All</option>' + STATE.hosts.map(h => `<option ${h.name === hv ? 'selected' : ''}>${esc(h.name)}</option>`).join('');
  cs.innerHTML = '<option value="">All</option>' + cats.map(c => `<option ${c === cv ? 'selected' : ''}>${esc(c)}</option>`).join('');
}

function renderChanges() {
  if (!STATE) return;
  const fh = document.querySelector('#f-host').value, fc = document.querySelector('#f-cat').value;
  const withCat = document.querySelector('#f-catalogue').checked, withBase = document.querySelector('#f-base').checked;
  const rows = STATE.changes.filter(e =>
    (!fh || e.host === fh) && (!fc || e.category === fc) &&
    (withCat || e.section !== 'cpuse_available') && (withBase || e.change !== 'baseline'));
  const first = knownKeys === null;
  const keys = new Set(STATE.changes.map(evKey));
  const tb = document.querySelector('#changes');
  if (!rows.length) {
    tb.innerHTML = `<tr><td colspan="7" class="empty">No changes recorded yet. The first successful poll of each host becomes its baseline; later polls are compared against the previous one.</td></tr>`;
  } else {
    tb.innerHTML = rows.map(e => `<tr class="${!first && !knownKeys.has(evKey(e)) ? 'fresh' : ''}">
      <td class="nowrap">${esc(e.ts)}</td><td class="nowrap">${esc(e.host)}</td><td class="nowrap">${esc(e.category)}</td>
      <td>${badge(e.change)}</td><td class="item">${esc(e.item)}</td>
      <td class="old">${esc(e.old || '')}</td><td class="new">${esc(e.new || '')}</td></tr>`).join('');
  }
  const newCount = first ? 0 : [...keys].filter(k => !knownKeys.has(k)).length;
  if (newCount) document.title = `(${newCount} new) Monitor-AutoUpdater`;
  knownKeys = keys;
}
window.addEventListener('focus', () => { document.title = 'Monitor-AutoUpdater'; });

async function collectNow() {
  document.querySelector('#btn-collect').disabled = true;
  await fetch('/api/collect', {method: 'POST'});
  setTimeout(refresh, 800);
}

/* ---------- drawer ---------- */
function openDrawer(name) {
  openHost = name; activeTab = 'drift';
  document.querySelector('#overlay').classList.add('open');
  document.querySelector('#drawer').classList.add('open');
  document.querySelector('#d-body').innerHTML = '<div class="empty">Loading…</div>';
  loadHost(name, true);
}
function closeDrawer() {
  openHost = null;
  document.querySelector('#overlay').classList.remove('open');
  document.querySelector('#drawer').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

async function loadHost(name, first) {
  const r = await fetch('/api/host/' + encodeURIComponent(name), {cache: 'no-store'});
  hostData = await r.json();
  const g = hostData.last_good, l = hostData.latest;
  document.querySelector('#d-title').textContent = name;
  document.querySelector('#d-sub').textContent =
    `Last good: ${g ? localTime(g.collected_at) : '—'} · Baseline: ${localTime(hostData.baseline_at)}` +
    (l && !l.ok ? ` · Last poll FAILED: ${l.error}` : '') + (g ? ` · login shell: ${g.login_shell}` : '');
  renderTabs();
}

const TABS = [
  ['drift', 'Drift since baseline'], ['events', 'Host change log'], ['components', 'AU components'],
  ['bundles', 'Bundles'], ['cpuse', 'CPUSE / DA'], ['consent', 'Consent flags'], ['lic', 'Contracts & licences'], ['log', 'Logs'], ['raw', 'Raw output'],
];
function renderTabs() {
  document.querySelector('#d-tabs').innerHTML = TABS.map(([k, t]) =>
    `<div class="tab ${k === activeTab ? 'active' : ''}" onclick="activeTab='${k}';renderTabs()">${t}</div>`).join('');
  document.querySelector('#d-body').innerHTML = renderTab(activeTab);
}

const sec = n => ((hostData.last_good || {}).sections || {})[n] || {};

function eventTable(evs, withTime) {
  if (!evs.length) return '<div class="empty">Nothing to show.</div>';
  return `<div class="table-wrap"><table><thead><tr>${withTime ? '<th>Time</th>' : ''}<th>Category</th><th>Change</th><th>Item</th><th>Old</th><th>New</th></tr></thead><tbody>` +
    evs.map(e => `<tr>${withTime ? `<td class="nowrap">${esc(e.ts)}</td>` : ''}<td class="nowrap">${esc(e.category)}</td><td>${badge(e.change)}</td>
      <td class="item">${esc(e.item)}</td><td class="old">${esc(e.old || '')}</td><td class="new">${esc(e.new || '')}</td></tr>`).join('') +
    '</tbody></table></div>';
}

function renderTab(t) {
  if (!hostData.last_good) return '<div class="empty">No successful poll yet for this host.</div>';
  if (t === 'drift') return `<div class="note">Everything that differs between the baseline (${esc(localTime(hostData.baseline_at))}) and the latest good poll. Use Re-baseline to start counting from now.</div>` + eventTable(hostData.drift, false);
  if (t === 'events') return eventTable(hostData.events.filter(e => e.change !== 'baseline'), true);
  if (t === 'components') {
    const d = sec('au_components').data || {};
    const names = Object.keys(d).sort();
    if (!names.length) return errOrEmpty('au_components');
    return `<div class="table-wrap"><table><thead><tr><th>Component</th><th>Attributes</th></tr></thead><tbody>` +
      names.map(n => `<tr><td class="nowrap" style="color:var(--text)">${esc(n)}</td><td class="item">${esc(Object.entries(d[n]).map(([k, v]) => k + '=' + v).join('   '))}</td></tr>`).join('') +
      '</tbody></table></div>';
  }
  if (t === 'bundles') {
    const d = sec('bundles').data || {};
    const names = Object.keys(d).sort();
    if (!names.length) return errOrEmpty('bundles');
    return `<div class="table-wrap"><table><thead><tr><th>Bundle</th><th>Take</th><th>Products</th></tr></thead><tbody>` +
      names.map(n => `<tr><td class="item">${esc(n)}</td><td class="nowrap">${esc(d[n].take)}</td><td class="nowrap">${esc(d[n].products.join(', '))}</td></tr>`).join('') +
      '</tbody></table></div>';
  }
  if (t === 'cpuse') return rawBlock('da') + rawBlock('cpuse_installed') + rawBlock('cpuse_available');
  if (t === 'consent') {
    const c = sec('consent').data || {gaia_db: {}, effective: {}};
    const keys = [...new Set([...Object.keys(c.effective || {}), ...Object.keys(c.gaia_db || {})])];
    const cell = v => v === undefined ? '—' : badge(v === 'true' ? 'ok' : (v === 'false' ? 'pending' : 'changed'), v);
    return `<div class="note">Effective = DownloadAccess in $CPDIR/tmp/umis_objects.C (what fwd is actually using). Gaia DB = dbget values (FTCW defaults or a local Clish override). See sk175504 sections 2-D and 4.</div>` +
      (keys.length ? `<div class="table-wrap" style="margin-bottom:16px"><table><thead><tr><th>Flag</th><th>Effective</th><th>Gaia DB</th></tr></thead><tbody>` +
      keys.map(k => `<tr><td class="nowrap">${esc(k)}</td><td>${cell((c.effective || {})[k])}</td><td>${cell((c.gaia_db || {})[k])}</td></tr>`).join('') +
      '</tbody></table></div>' : '') + rawBlock('consent');
  }
  if (t === 'lic') return rawBlock('contracts') + rawBlock('licences');
  if (t === 'log') {
    const files = sec('au_logs').data || [];
    let h = '<h3>AutoUpdater log files (newest first)</h3>';
    h += files.length ? `<div class="table-wrap" style="margin-bottom:16px"><table><thead><tr><th>Modified</th><th>Size</th><th>Path</th></tr></thead><tbody>` +
      files.map(f => `<tr><td class="nowrap">${esc(f.mtime.replace('T', ' '))}</td><td class="nowrap">${f.size}</td><td class="item">${esc(f.path)}</td></tr>`).join('') + '</tbody></table></div>'
      : '<div class="note">No AutoUpdater log files found in the searched paths.</div>';
    return h + rawBlock('au_log_tail') + rawBlock('da_log_tail');
  }
  if (t === 'raw') return Object.keys(hostData.last_good.sections).map(rawBlock).join('');
  return '';
}

function errOrEmpty(n) {
  const s = sec(n);
  return s.error ? `<div class="err">${esc(hostData.titles[n] || n)}: ${esc(s.error)}</div>` : '<div class="empty">Nothing to show.</div>';
}
function rawBlock(n) {
  const s = sec(n), title = hostData.titles[n] || n;
  if (!s || s.raw === undefined) return `<h3>${esc(title)}</h3><div class="note">Not collected.</div>`;
  const extra = n === 'au_log_tail' && s.data ? ` — ${s.data.path}` : '';
  return `<h3>${esc(title)}${esc(extra)} ${s.ok ? '' : badge('error', s.error || 'failed')}</h3><pre>${esc(s.raw || '(no output)')}</pre>`;
}

async function rebaseline() {
  if (!openHost || !confirm(`Make the latest good snapshot of ${openHost} its new baseline?`)) return;
  await fetch('/api/rebaseline/' + encodeURIComponent(openHost), {method: 'POST'});
  lastGen = -1; refresh();
}

refresh();
timer = setInterval(refresh, refreshMs);
setInterval(updateNext, 1000);
</script>
</body>
